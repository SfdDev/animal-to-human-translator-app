services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: translator
      POSTGRES_PASSWORD: translator
      POSTGRES_DB: translator
    ports:
      - "5433:5432"
    volumes:
      - translator_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translator -d translator"]
      interval: 2s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      target: backend
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgres://translator:translator@postgres:5432/translator
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:5173}
    environment:
      API_PROXY: http://backend:3001
      VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:5173}
    ports:
      - "5173:4173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  translator_pg:
